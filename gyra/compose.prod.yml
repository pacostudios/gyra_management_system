# Server overrides. Run from gyra/ on the server:
#   docker compose -f compose.yml -f compose.prod.yml up -d --wait
# The server's .env is generated from AWS Secrets Manager / SSM, never copied from .env.example.
# Postgres (RDS) and email (SES) are managed AWS services, so they are not containers here.
# No service publishes a host port; the reverse proxy (deferred) will be the only entry point.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-prod: &backend-prod
  restart: always
  logging: *logging
  environment:
    NODE_ENV: production
  # Gate: the backend image has no production stage until S5, so these services
  # must not start on the server yet. S5 adds `build.target: runtime` and removes this.
  profiles: ["needs-s5-runtime-image"]

services:
  redis:
    restart: always
    logging: *logging

  backend:
    <<: *backend-prod

  worker:
    <<: *backend-prod
