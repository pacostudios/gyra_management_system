# Base services shared by every environment. Run from gyra/:
#   Local:  docker compose up -d --wait
#           (Compose also loads compose.override.yml: local postgres, mailpit, host ports)
#   Server: docker compose -f compose.yml -f compose.prod.yml up -d --wait
#           (no override file: postgres is RDS, email is SES, nothing published to the host)

name: gyra

services:
  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    # AOF persistence + password. BullMQ requires noeviction so queued jobs are never dropped.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REST API. Local: dev target with live reload (override). Server: runtime target (S5).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: &backend-env
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # BullMQ jobs. Same image as backend, different entrypoint; scales separately.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
