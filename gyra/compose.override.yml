# Local development only. `docker compose up` merges this file automatically;
# the server never loads it (it passes -f compose.yml -f compose.prod.yml).
# Every port binds to 127.0.0.1 so nothing is reachable from the network.

x-backend-dev: &backend-dev
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy
  # `docker compose up --watch`: saved files are copied into the container and tsx restarts.
  develop:
    watch:
      - action: sync
        path: ./backend/src
        target: /app/backend/src
        ignore:
          - generated/
      - action: sync
        path: ./shared/src
        target: /app/shared/src
      # Schema changes: copy, then restart so `prisma generate` runs again.
      - action: sync+restart
        path: ./backend/prisma
        target: /app/backend/prisma
      # Dependency changes: rebuild the image.
      - action: rebuild
        path: ./backend/package.json
      - action: rebuild
        path: ./shared/package.json
      - action: rebuild
        path: ./pnpm-lock.yaml

services:
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    <<: *backend-dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"

  worker:
    <<: *backend-dev
    command: ["pnpm", "dev:worker"]

  # Stand-in for RDS
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Stand-in for SES: catches every outgoing email; view them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
